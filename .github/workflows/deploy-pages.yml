name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Set paths for the project site
        run: |
          find dist/client -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.rsc' \) -exec sed -i 's|"/_next/|"/deem-alosili-portfolio/_next/|g; s|"/case-studies/|"/deem-alosili-portfolio/case-studies/|g; s|"/localization-posts/|"/deem-alosili-portfolio/localization-posts/|g; s|"/fonts/|"/deem-alosili-portfolio/fonts/|g' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
